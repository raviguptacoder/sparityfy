name: ingest

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma separated categories, empty for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest gifs
        env:
          INGEST_ONLY: ${{ inputs.only }}
        run: node scripts/ingest.mjs

      - name: Commit gifs and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REF_ARGS=""
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ingest: add gifs"
            REF_ARGS="--ref $(git rev-parse HEAD)"
          elif [ ! -f manifest.json ]; then
            REF_ARGS="--ref $(git rev-parse HEAD)"
          fi
          node scripts/build-manifest.mjs $REF_ARGS
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "manifest: update"
          fi
          git push
