name: ingest

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma separated categories, empty for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Ingest gifs
        env:
          INGEST_ONLY: ${{ inputs.only }}
        run: node scripts/ingest.mjs

      - name: Commit gifs and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REF_ARGS=""
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ingest: add gifs"
            REF_ARGS="--ref $(git rev-parse HEAD)"
          elif [ ! -f manifest.json ]; then
            REF_ARGS="--ref $(git rev-parse HEAD)"
          fi
          node scripts/build-manifest.mjs $REF_ARGS
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "manifest: update"
          fi
          git push
